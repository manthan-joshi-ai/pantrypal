version: "3.9"

services:

  frontend:
    build:
      context: ./frontend

    container_name: pantrypal_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

    depends_on:
      - backend

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: pantrypal_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/backend

    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: phi3:mini
      OLLAMA_VISION_MODEL: llava:7b
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    restart: unless-stopped
